{{- if .Values.mysql.enabled -}}
{{- $name := printf "%s-mysql" (include "wordpress-example.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress-example.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
data:
  root-password: {{ .Values.mysql.rootPassword | b64enc | default (get $existing "root-password") | default (randAlphaNum 32 | b64enc) | quote }}
  password: {{ .Values.mysql.password | b64enc | default (get $existing "password") | default (randAlphaNum 32 | b64enc) | quote }}
{{- end }}
