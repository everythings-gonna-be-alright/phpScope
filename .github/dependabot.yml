version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
