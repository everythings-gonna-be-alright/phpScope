ingress:
  enabled: false

phpscope:
  image:
    repository: phpscope
    tag: e2e
    pullPolicy: Never
  config:
    # qstring and ts identify each request, which the per-request assertions need.
    requestInfo: "pq"
    sampleLabels: "path,qstring,ts"
    tags:
      - env=e2e
      - app=wordpress
